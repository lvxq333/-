server:
  port: 8082
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: 12345678
  redis:
    host: localhost
    port: 6379
#    password: 12345678
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略空字段

  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: REMOVED_OSS_ACCESS_KEY_ID
    access-key-secret: REMOVED_OSS_ACCESS_KEY_SECRET
    bucket-name: lhb-sky-take-out
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # 消息 key 的序列化方式
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 消息 value 的序列化方式（JSON）
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # 可靠性：所有副本确认后才认为发送成功
      acks: all
      # 发送失败重试次数
      retries: 3
      # 批量发送大小——攒够16KB（默认）批量发送
      batch-size: 16384
      # 缓冲区大小32MB（默认）
      buffer-memory: 33554432
      properties:
        linger.ms: 10                    # ← 新增：最多等10ms凑批次
        request.timeout.ms: 10000        # ← 新增：发送超时10秒
    consumer:
      # 消息 key 的反序列化方式
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 消息 value 的反序列化方式（JSON）
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # 消费者组 ID
      group-id: seckill-order-group
      # 信任的包（JSON 反序列化安全白名单）
      properties:
        spring.json.trusted.packages: com.hmdp.dto
        session.timeout.ms: 30000        # ← 新增：30秒没心跳→触发重平衡
        heartbeat.interval.ms: 3000      # ← 新增：每3秒发心跳
        max.poll.interval.ms: 300000     # ← 新增：两次poll间隔最长5分钟
      # 手动提交偏移量，防止消息丢失
      enable-auto-commit: false
      # 从最早未消费的消息开始（首次启动时）
      auto-offset-reset: earliest
    listener:
      # 手动确认模式
      ack-mode: manual

mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
